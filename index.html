<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<meta name="description" content="Track Lab: motion-tracking experiments that run entirely in your browser. Hands, gestures, and whatever comes next.">
<title>Track Lab</title>
<link rel="icon" href="brand/track-lab/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/hub.css">
</head>
<body>
<header class="hero">
  <canvas id="heroCanvas" aria-hidden="true"></canvas>
  <img class="hero-mark" src="brand/track-lab/mark.svg" alt="Track Lab">
  <div class="hero-inner">
    <p class="kicker"><span class="dot"></span>Live in the browser · nothing leaves your device</p>
    <h1>Track<br>Lab</h1>
    <p class="lede">Motion-tracking experiments. Point a camera at yourself and play.</p>
    <div class="meta" id="meta"></div>
  </div>
  <div class="readout" aria-hidden="true">
    <span>tracker <b>mediapipe</b></span>
    <span>landmarks <b>21 × 2</b></span>
    <span>fps <b id="fps">--</b></span>
  </div>
</header>

<main>
  <div class="section-head">
    <h2>Experiences</h2>
    <span class="count" id="count"></span>
  </div>
  <ol class="grid" id="grid"></ol>
</main>

<footer>
  <span>Track Lab · camera-based toys, all processed locally with <a href="https://ai.google.dev/edge/mediapipe" rel="noopener">MediaPipe</a></span>
  <a href="https://github.com/Ledsav/track-lab" rel="noopener">Source on GitHub →</a>
</footer>

<script type="module" src="assets/hub.js"></script>
</body>
</html>
